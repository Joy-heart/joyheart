name: JoyHeart discovery and profile privacy validation

on:
  pull_request:
    paths:
      - "supabase/migrations/20261109160000_joyheart_member_compatibility_settings.sql"
      - "supabase/migrations/20261110100000_joyheart_private_discovery_ranking.sql"
      - "supabase/migrations/20261110170000_joyheart_profile_column_privileges.sql"
      - "supabase/tests/joyheart_discovery_engine_smoke.sql"
      - "supabase/tests/joyheart_profile_column_security.sql"
      - "supabase/tests/fixtures/joyheart_discovery_engine_fixture.sql"
      - "supabase/review/round-5a1-secure-profile-permission-recovery.sql"
      - "supabase/review/round-2-profile-security-rollback.sql"
      - "supabase/tests/joyheart_profile_legacy_acl_preflight.sql"
      - "supabase/tests/round5a3_profile_security_evidence.sql"
      - "supabase/tests/round5a3_capture_rollback_guard_state.sql"
      - "supabase/tests/round5a3_verify_rollback_guard_state.sql"
      - "supabase/tests/round5a3_application_database_contracts.sql"
      - ".github/workflows/discovery-engine-migration-validation.yml"
  push:
    branches:
      - "feat/**"
      - "phase-2/review-fixes"
    paths:
      - "supabase/migrations/20261109160000_joyheart_member_compatibility_settings.sql"
      - "supabase/migrations/20261110100000_joyheart_private_discovery_ranking.sql"
      - "supabase/migrations/20261110170000_joyheart_profile_column_privileges.sql"
      - "supabase/tests/joyheart_discovery_engine_smoke.sql"
      - "supabase/tests/joyheart_profile_column_security.sql"
      - "supabase/tests/fixtures/joyheart_discovery_engine_fixture.sql"
      - "supabase/review/round-5a1-secure-profile-permission-recovery.sql"
      - "supabase/review/round-2-profile-security-rollback.sql"
      - "supabase/tests/joyheart_profile_legacy_acl_preflight.sql"
      - "supabase/tests/round5a3_profile_security_evidence.sql"
      - "supabase/tests/round5a3_capture_rollback_guard_state.sql"
      - "supabase/tests/round5a3_verify_rollback_guard_state.sql"
      - "supabase/tests/round5a3_application_database_contracts.sql"
      - ".github/workflows/discovery-engine-migration-validation.yml"
      - ".github/workflows/discovery-engine-migration-validation.yml"

permissions:
  contents: read

jobs:
  validate-discovery-and-profile-privacy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Prepare isolated synthetic database fixture
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/joyheart_discovery_engine_fixture.sql
      - name: Verify legacy ACL fixture vulnerabilities before migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/joyheart_profile_legacy_acl_preflight.sql
      - name: Apply private compatibility settings migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261109160000_joyheart_member_compatibility_settings.sql
      - name: Apply discovery engine migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261110100000_joyheart_private_discovery_ranking.sql
      - name: Apply proposed profile column privilege migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261110170000_joyheart_profile_column_privileges.sql
      - name: Verify discovery engine protections
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/joyheart_discovery_engine_smoke.sql
      - name: Verify profile column privacy with synthetic identities
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/joyheart_profile_column_security.sql
      - name: Apply secure profile permission recovery
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/review/round-5a1-secure-profile-permission-recovery.sql
      - name: Verify recovery idempotency
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/review/round-5a1-secure-profile-permission-recovery.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/joyheart_profile_column_security.sql
      - name: Verify synthetic application database contracts
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/round5a3_application_database_contracts.sql
      - name: Capture state before deprecated rollback guard
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/round5a3_capture_rollback_guard_state.sql
      - name: Verify deprecated rollback guard fails without changing database state
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          set -euo pipefail
          if psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/review/round-2-profile-security-rollback.sql > rollback-guard.log 2>&1; then
            echo "ERROR: deprecated rollback guard unexpectedly succeeded"
            cat rollback-guard.log
            exit 1
          fi
          grep -F "UNSAFE_LEGACY_ROLLBACK_DISABLED" rollback-guard.log
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/round5a3_verify_rollback_guard_state.sql
          cat rollback-guard.log
      - name: Export machine-readable profile security evidence
        env:
          PGPASSWORD: postgres
        run: |
          mkdir -p artifacts
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -v commit_sha="$GITHUB_SHA" -At -f supabase/tests/round5a3_profile_security_evidence.sql > artifacts/joyheart-profile-security-evidence.json
          python -m json.tool artifacts/joyheart-profile-security-evidence.json > /dev/null
          cat artifacts/joyheart-profile-security-evidence.json
      - name: Upload profile security evidence
        uses: actions/upload-artifact@v4
        with:
          name: joyheart-profile-security-evidence
          path: artifacts/joyheart-profile-security-evidence.json
          if-no-files-found: error
          retention-days: 30
