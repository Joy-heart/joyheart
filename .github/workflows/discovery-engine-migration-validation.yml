name: JoyHeart discovery and profile privacy validation

on:
  pull_request:
    paths:
      - "supabase/migrations/20261110100000_joyheart_private_discovery_ranking.sql"
      - "supabase/migrations/20261110170000_joyheart_profile_column_privileges.sql"
      - "supabase/tests/joyheart_discovery_engine_smoke.sql"
      - "supabase/tests/joyheart_profile_column_security.sql"
      - "supabase/tests/fixtures/joyheart_discovery_engine_fixture.sql"
      - ".github/workflows/discovery-engine-migration-validation.yml"
  push:
    branches:
      - "feat/**"
      - "phase-2/review-fixes"
    paths:
      - "supabase/migrations/20261110100000_joyheart_private_discovery_ranking.sql"
      - "supabase/migrations/20261110170000_joyheart_profile_column_privileges.sql"
      - "supabase/tests/joyheart_discovery_engine_smoke.sql"
      - "supabase/tests/joyheart_profile_column_security.sql"
      - "supabase/tests/fixtures/joyheart_discovery_engine_fixture.sql"
      - ".github/workflows/discovery-engine-migration-validation.yml"

permissions:
  contents: read

jobs:
  validate-discovery-and-profile-privacy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Prepare isolated synthetic database fixture
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/joyheart_discovery_engine_fixture.sql
      - name: Apply discovery engine migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261110100000_joyheart_private_discovery_ranking.sql
      - name: Apply proposed profile column privilege migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261110170000_joyheart_profile_column_privileges.sql
      - name: Verify discovery engine protections
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/joyheart_discovery_engine_smoke.sql
      - name: Verify profile column privacy with synthetic identities
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/joyheart_profile_column_security.sql
