name: JoyHeart production deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_production_deployment:
        description: "I approve deploying the current main branch to the live JoyHeart Worker"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: joyheart-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy existing JoyHeart Worker
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.confirm_production_deployment == true)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Vinext compatibility
        run: npm run check:compatibility

      - name: Build application
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Verify deployment credentials are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing repository variable CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing repository secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "Missing repository secret SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
          echo "GitHub deployment credentials are present. The encrypted SUPABASE_SERVICE_ROLE_KEY must also be configured on the Cloudflare joyheart Worker."

      - name: Deploy to the existing joyheart Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run deploy
