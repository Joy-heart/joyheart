name: JoyHeart production deployment

on:
  workflow_dispatch:
    inputs:
      confirm_production_deployment:
        description: "I approve deploying the current main branch to the live JoyHeart Worker"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: joyheart-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy existing JoyHeart Worker
    if: github.ref == 'refs/heads/main' && inputs.confirm_production_deployment == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Vinext compatibility
        run: npm run check:compatibility

      - name: Build application
        run: npm run build

      - name: Verify deployment credentials are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing repository variable CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing repository secret CLOUDFLARE_API_TOKEN"; exit 1; }

      - name: Deploy to the existing joyheart Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy
