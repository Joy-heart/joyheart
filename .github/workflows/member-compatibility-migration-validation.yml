name: Member compatibility migration validation

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/member_compatibility_settings.sql"
      - ".github/workflows/member-compatibility-migration-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-member-compatibility-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Prepare minimal Supabase-compatible auth schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid()
          RETURNS uuid
          LANGUAGE sql
          STABLE
          AS $$
            SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid
          $$;
          GRANT USAGE ON SCHEMA auth TO anon, authenticated;
          GRANT EXECUTE ON FUNCTION auth.uid() TO anon, authenticated;
          SQL
      - name: Apply the migration to the isolated CI database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261109160000_joyheart_member_compatibility_settings.sql
      - name: Verify owner isolation, RPC validation and grants
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/member_compatibility_settings.sql
