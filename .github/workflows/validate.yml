name: JoyHeart validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: joyheart-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Compatibility and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Generate Cloudflare configuration with caching disabled
        run: npm run setup:cloudflare

      - name: Preserve generated source configuration for review
        uses: actions/upload-artifact@v4
        with:
          name: joyheart-cloudflare-source
          path: |
            package.json
            package-lock.json
            vite.config.ts
            cloudflare.config.ts
            .gitignore
            tsconfig.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Check vinext compatibility
        run: npm run check:compatibility

      - name: Build production application
        run: npm run build
