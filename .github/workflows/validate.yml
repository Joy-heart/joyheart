name: JoyHeart validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: joyheart-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Compatibility and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Generate Cloudflare configuration with caching disabled
        run: npm run setup:cloudflare

      - name: Keep generated Cloudflare types included by TypeScript
        run: node -e "const fs=require('fs');const p='tsconfig.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.exclude=(c.exclude||[]).filter(x=>x!=='.cloudflare');fs.writeFileSync(p,JSON.stringify(c,null,2)+'\\n')"

      - name: Commit generated Cloudflare source configuration
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json vite.config.ts cloudflare.config.ts .gitignore tsconfig.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: preserve generated Cloudflare configuration"
            git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
          fi

      - name: Check vinext compatibility
        run: npm run check:compatibility

      - name: Build production application
        run: npm run build
